[core]
#gbm-format=argb8888
idle-time=0
#use-g2d=1
#xwayland=true
#drm-device=card0
#repaint-window=16
#enable-overlay-view=1

[shell]
size=1920x1080
background-image=/usr/share/weston/wallpaper.png
background-type=scale
panel-color=0x00ffffff
panel-position=top

[libinput]
touchscreen_calibrator=true

[screen-share]
command=@bindir@/weston --backend=rdp-backend.so --shell=fullscreen-shell.so --no-clients-resize


[launcher]
icon=/usr/share/weston/terminal_24x24.png
path=/usr/bin/xfce4-terminal

[launcher]
icon=/usr/share/weston/thunar.png
path=/usr/bin/thunar

[launcher]
icon=/usr/share/weston/chromium_24x24.png
path=/usr/bin/chromium --no-sandbox --disable-gpu
